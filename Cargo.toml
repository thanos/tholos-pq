[package]
name = "tholos-pq"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust post-quantum multi-recipient encryption: ML-KEM-1024 + ML-DSA-65 + XChaCha20-Poly1305"
license = "Apache-2.0"
repository = "https://github.com/thanos/tholos-pq"
authors = ["Thanos Vassilakis <thanosv@gmail.com>"]
keywords = ["cryptography", "post-quantum", "encryption", "ml-dsa", "multi-recipient"]
categories = ["cryptography", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/tholos-pq"

[dependencies]
rand = { version = "0.8", features = ["std_rng"] }
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_bytes = "0.11"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
hkdf = "0.12"
thiserror = "1.0"
chacha20poly1305 = "0.10.1"
zeroize = "1"
ml-kem = { version = "0.2", features = ["zeroize"] }
dilithium-rs = "0.3"

[dev-dependencies]
proptest = "1.5"
hex = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
cognitive_complexity = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
type_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unnecessary_cast = "warn"
unnecessary_wraps = "warn"
single_char_pattern = "warn"
many_single_char_names = "allow"
module_name_repetitions = "allow"
cloned_ref_to_slice_refs = "warn"
