name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Create a GitHub Environment named "crates-io" and match it in the
    # crates.io trusted publisher config (optional but recommended).
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Git tag 'v${tag}' does not match Cargo.toml version '${version}'"
            exit 1
          fi
          echo "Publishing tholos-pq ${version}"

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --dry-run

      # Preferred: trusted publishing via OIDC (no long-lived token).
      # Fallback: repository secret CARGO_REGISTRY_TOKEN.
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::No crates.io credentials. Configure trusted publishing for this workflow, or set secret CARGO_REGISTRY_TOKEN."
            exit 1
          fi
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
